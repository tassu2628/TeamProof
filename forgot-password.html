<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | TeamProof</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="forgot-section">

        <div class="forgot-card">

            <a href="index.html" class="forgot-logo">
                <span>✓</span>
                Team<span>Proof</span>
            </a>

            <div class="forgot-icon">🔐</div>

            <h1>Forgot Password?</h1>

            <p>
                Enter your registered email address.
                We will help you recover your account.
            </p>

            <form id="forgot-form">

                <div class="form-group">

                    <label for="forgot-email">Email Address</label>

                    <input
                        type="email"
                        id="forgot-email"
                        name="email"
                        placeholder="Enter your registered email"
                        required
                    >

                </div>

                <p id="forgot-message" role="status"></p>

                <button type="submit" class="forgot-submit">
                    Reset Password →
                </button>

            </form>

            <a href="login.html" class="forgot-back">
                ← Back to Login
            </a>

        </div>

    </section>

    <script src="script.js"></script>

</body>
</html>
